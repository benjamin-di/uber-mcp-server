[project]
name = "uber-mcp"
version = "0.3.13"
description = "Unofficial MCP server for Uber rides: places, live fares, ride requests behind a confirm step, trip status and history"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
authors = [{ name = "benjamin-di" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "uber", "rides", "taxi", "travel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    # FastMCP 4 (MCP SDK 2): stdio, and stateless JSON over streamable HTTP.
    "fastmcp==4.0.10",
    # AES-GCM for the saved session at rest (already in the lock through FastMCP's auth stack).
    "cryptography>=50.0.0",
    # The per-user state folder for local use (already in the lock through FastMCP).
    "platformdirs>=4.3",
    # The sign-in window and its links: the login service, the relay, the paste add-on.
    "signin-window>=0.1.2,<0.2",
]

[project.urls]
Homepage = "https://github.com/benjamin-di/uber-mcp-server"
Issues = "https://github.com/benjamin-di/uber-mcp-server/issues"

[project.scripts]
uber-mcp = "uber_mcp.cli:main"

[project.optional-dependencies]
# The sign-in window: `uber-mcp login` and the login service's image (Dockerfile.login). The server image never
# installs it (requirements-runtime.lock has no extras).
login = ["patchright==1.61.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.uv]
# Security floors for FastMCP's dependencies.
constraint-dependencies = [
    "starlette>=1.3.1,<2",
    "cryptography>=50.0.0",
    "joserfc>=1.6.8",
    "idna>=3.15",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "authlib>=1.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uber_mcp", "src/uber_login"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["uber_mcp", "uber_login"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
